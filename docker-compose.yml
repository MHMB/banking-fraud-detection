version: '3.8'

services:
  # Neo4j Graph Database Service
  neo4j:
    image: neo4j:5.26.2
    container_name: banking_analysis_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"  # HTTP (includes Browser UI)
      - "7687:7687"  # Bolt (fixed from 7473 to standard 7687)
    environment:
      # Increase memory limits for graph processing
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=1G

      # Authentication
      - NEO4J_AUTH=neo4j/password123

      # Logging
      - NEO4J_dbms_logs_debug_level=INFO
    volumes:
      # Persist data across container restarts
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    networks:
      - banking_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7474", "--timeout=5", "-O", "/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

# Persistent Volumes for Data Persistence
volumes:
  neo4j_data:
    driver: local
    name: banking_analysis_neo4j_data
  neo4j_logs:
    driver: local
    name: banking_analysis_neo4j_logs
  neo4j_import:
    driver: local
    name: banking_analysis_neo4j_import
  neo4j_plugins:
    driver: local
    name: banking_analysis_neo4j_plugins

# Network for service communication
networks:
  banking_network:
    driver: bridge
    name: banking_analysis_network